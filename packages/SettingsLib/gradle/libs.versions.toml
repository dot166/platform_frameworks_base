[versions]
aconfig = "1.3.1"
agp = "9.2.1"
appcompat = "1.7.1"
collectionKtx = "1.6.0"
coreKtx = "1.19.0"
coreTesting = "2.2.0"
graphicsShapesAndroid = "1.1.0"
guava = "33.6.0-android"
jsr305 = "3.0.2"
lifecycleRuntimeCompose = "2.11.0"
lottieCompose = "6.7.1"
material = "1.14.0"
material3 = "1.5.0-alpha22"
materialIconsExtended = "1.7.8"
maven = "0.37.0"
mockitoCore = "5.23.0"
mpandroidchart = "v3.1.0-alpha"
navigationCompose = "2.9.8"
kotlin = "2.4.0" # external/kotlinc/build.txt
dexmaker-mockito = "2.28.6"
mockito-kotlin = "6.3.0" # external/mockito-kotlin/METADATA
truth = "1.4.5" # external/truth
uiTooling = "1.11.3"
window = "1.5.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven" }
aconfig = { id = "io.github.dot166.aconfig", version.ref = "aconfig" }

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-collection-ktx = { module = "androidx.collection:collection-ktx", version.ref = "collectionKtx" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "coreTesting" }
androidx-graphics-shapes-android = { module = "androidx.graphics:graphics-shapes-android", version.ref = "graphicsShapesAndroid" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-lifecycle-runtime-testing = { module = "androidx.lifecycle:lifecycle-runtime-testing", version.ref = "lifecycleRuntimeCompose" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }
androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "uiTooling" }
androidx-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "uiTooling" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "uiTooling" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "uiTooling" }
androidx-window = { module = "androidx.window:window", version.ref = "window" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottieCompose" }
material = { module = "com.google.android.material:material", version.ref = "material" }
dexmaker-mockito = { module = "com.linkedin.dexmaker:dexmaker-mockito", version.ref = "dexmaker-mockito" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockitoCore" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
mpandroidchart = { module = "com.github.PhilJay:MPAndroidChart", version.ref = "mpandroidchart" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
