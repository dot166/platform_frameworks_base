[versions]
aconfig = "1.3.1"
agp = "9.2.1"
collectionKtx = "1.6.0"
coreKtx = "1.19.0"
guava = "33.6.0-android"
material = "1.14.0"
maven = "0.37.0"
preference = "1.2.1"
kotlin = "2.4.0" # external/kotlinc/build.txt
dexmaker-mockito = "2.28.6"
mockito-kotlin = "6.3.0" # external/mockito-kotlin/METADATA
truth = "1.4.5" # external/truth

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven" }
aconfig = { id = "io.github.dot166.aconfig", version.ref = "aconfig" }

[libraries]
androidx-collection-ktx = { module = "androidx.collection:collection-ktx", version.ref = "collectionKtx" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
material = { module = "com.google.android.material:material", version.ref = "material" }
dexmaker-mockito = { module = "com.linkedin.dexmaker:dexmaker-mockito", version.ref = "dexmaker-mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
