name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  filter-paths:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.filter.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            should_publish:
              - 'packages/SettingsLib/**'

  build:
    runs-on: ubuntu-latest
    needs: filter-paths
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWD }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
    
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: |
        cd packages/SettingsLib
        chmod +x gradlew

    - name: Generate Keystore
      run: |
        cd packages/SettingsLib
        echo "${{ secrets.KEYSTORE }}" > a.txt
        base64 -d a.txt > key.jks
        echo "${{ secrets.KEYSTORE_PROPS }}" > b.txt
        base64 -d b.txt > keystore.properties
        rm -rf a.txt b.txt

    - name: Build
      run: |
        cd packages/SettingsLib
        ./gradlew assembleRelease

    - name: Publish to Maven Central
      if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/17' && github.repository == 'dot166/platform_frameworks_base' && needs.filter-paths.outputs.should_publish == 'true' }}
      run: |
        cd packages/SettingsLib
        ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
